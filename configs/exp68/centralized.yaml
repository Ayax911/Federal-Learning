# exp68_linear_head_random_init — ablación de PESOS PREENTRENADOS:
# misma arquitectura y configuración de exp63 (cabeza lineal Dropout(0.5)+
# Linear), pero weight_source: none (inicialización aleatoria del backbone
# completo, sin RadImageNet) en vez de layer4-only descongelado.
#
# Motivación: exp62-65 midieron cuánta CAPACIDAD del backbone conviene
# descongelar partiendo siempre de RadImageNet; esta corrida mide una
# pregunta distinta — cuánto vale la propia inicialización RadImageNet frente
# a arrancar de cero, manteniendo todo lo demás igual (mismas 7 463 imágenes
# de train, mismo optimizer/scheduler, sin augmentation). Con solo 7 463
# imágenes (vs. ~1.2M de ImageNet o los datasets radiológicos de RadImageNet)
# es la comparación más directa de cuánto aporta el transfer learning en este
# régimen de datos chico.
#
# Con weight_source: none no tiene sentido freeze_backbone: true (sería
# congelar pesos aleatorios — un extractor de features inútil), así que acá
# el backbone entero es entrenable desde la época 0 (freeze_backbone: false,
# sin unfreeze_at_epoch/unfreeze_layers). Es la variante con más capacidad
# entrenable de toda la serie (100% de los 23.5M params, más que exp65's
# 99.04%), así que es razonable esperar overfitting agresivo — o incluso que
# los 100 epochs no alcancen para converger, dado que el dataset es ~160x más
# chico que ImageNet. ES ESO lo que la ablación busca cuantificar, no
# necesariamente "ganar".
#
# Resto de hiperparámetros IDÉNTICOS a exp63 (mismo manifest, mismo
# optimizer con lr_head/lr_backbone discriminativo, mismo scheduler coseno,
# sin augmentation, dropout=0.5, early stopping patience 15) para aislar
# weight_source+freeze_backbone como única variable frente al resto de la
# serie exp62-65.
#
# Estructura del manifest (manifests/mamo-bench-split-no-ddsm-rsna.csv):
#   train: 7 463 imgs  val: 934 imgs  test: 934 imgs  (9 331 total, 5 datasets)
#   (splits ya definidos en el CSV — val/test_fraction ignorados)
#
# Comando:
#   fedmammobench-centralized --config configs/exp68/centralized.yaml

name: exp68_linear_head_random_init
mode: centralized
seed: 42
output_dir: runs/exp68_linear_head_random_init
device: auto

data:
  name: mammo_bench
  manifest_path: manifests/mamo-bench-split-no-ddsm-rsna.csv   # 9 331 imgs, 5 datasets (sin DDSM)
  image_root: data/
  image_size: 224
  grayscale: false
  num_classes: 2
  batch_size: 32
  num_workers: 0
  val_fraction: 0.1        # IGNORADO: el manifest ya trae split explícito
  test_fraction: 0.1       # IGNORADO: idem
  image_format: jpg
  normal_policy: benign
  balance_classes: true    # datasets desbalanceados (kau-bcmd, cmmd)

model:
  name: resnet50
  weight_source: none                # Inicialización aleatoria — sin RadImageNet ni ImageNet
  in_channels: 3
  num_classes: 2                    # 2 neuronas de salida: softmax vía CrossEntropyLoss
  dropout: 0.5                      # Dropout antes del único Linear de salida (sin head.hidden_dims)
  freeze_backbone: false             # Sin pesos preentrenados no tiene sentido congelar nada:
                                    # el backbone completo entrena desde la época 0.

training:
  epochs: 100                       # techo; early_stopping_patience decide el corte real
  save_best_checkpoint: true        # requerido por early_stopping_patience
  best_checkpoint_metric: roc_auc
  early_stopping_patience: 15       # detiene tras 15 épocas sin mejorar val_roc_auc
  grad_clip_norm: 1.0
  mixed_precision: true
  optimizer:
    name: adamw
    lr: 1.0e-4
    lr_head: 1.0e-3         # LR de la cabeza
    lr_backbone: 1.0e-4     # LR del backbone completo (100% entrenable desde época 0 aquí)
    weight_decay: 1.0e-4
  scheduler:
    name: cosine
    t_max: 100
  augmentation:
    horizontal_flip: false
    vertical_flip: false
    rotate_limit: 0
    brightness_contrast: false
    elastic: false
    normalize_preset: radimagenet_rgb
  loss:
    name: ce
    auto_class_weights: true

evaluation:
  threshold: 0.5
  save_predictions: true
