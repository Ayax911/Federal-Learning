# exp63_linear_head_radimagenet_unfreeze_l4 — cabeza lineal simple
# (AdaptiveAvgPool2d(1) -> Flatten() -> Dropout(0.5) -> Linear) + layer4 de
# ResNet50 descongelado desde la época 0
#
# Segundo experimento de la ablación exp62-65 (ver comentario de exp62 para
# la tabla completa). Variante de exp62 que descongela layer4
# (14 964 736 params) desde la primera época:
#
#   trainable = 4 098 (cabeza) + 14 964 736 (layer4) = 14 968 834 / 23 512 130
#   = 63.66% (frente al 0.02% de exp62)
#
# Usa el fix v0.8.0 de unfreeze progresivo centralizado (Trainer.fit ahora
# aplica apply_freeze_policy por época — antes solo funcionaba en federado,
# ver CHANGELOG [0.8.0] y memoria centralized_progressive_unfreeze_fix).
# Mismo patrón ya usado en exp57-61, pero con cabeza lineal simple (dropout
# 0.5) en vez de la MLP profunda de esa serie.
#
# Resto de hiperparámetros IDÉNTICOS a exp62: mismo manifest, mismo optimizer
# (lr_head/lr_backbone), sin augmentation, dropout=0.5, early stopping
# patience 15. La única variable que cambia respecto a exp62/64/65 es
# unfreeze_layers.
#
# Estructura del manifest (manifests/mamo-bench-split-no-ddsm-rsna.csv):
#   train: 7 463 imgs  val: 934 imgs  test: 934 imgs  (9 331 total, 5 datasets)
#   (splits ya definidos en el CSV — val/test_fraction ignorados)
#
# Comando:
#   fedmammobench-centralized --config configs/exp63/centralized.yaml

name: exp63_linear_head_radimagenet_unfreeze_l4
mode: centralized
seed: 42
output_dir: runs/exp63_linear_head_radimagenet_unfreeze_l4
device: auto

data:
  name: mammo_bench
  manifest_path: manifests/mamo-bench-split-no-ddsm-rsna.csv   # 9 331 imgs, 5 datasets (sin DDSM)
  image_root: data/
  image_size: 224
  grayscale: false
  num_classes: 2
  batch_size: 32
  num_workers: 0
  val_fraction: 0.1        # IGNORADO: el manifest ya trae split explícito
  test_fraction: 0.1       # IGNORADO: idem
  image_format: jpg
  normal_policy: benign
  balance_classes: true    # datasets desbalanceados (kau-bcmd, cmmd)

model:
  name: resnet50
  weight_source: radimagenet          # RadImageNet directamente (no exp15/exp27 pretrain)
  checkpoint_path: weights/RadImageNet-resnet50.pth
  in_channels: 3
  num_classes: 2                    # 2 neuronas de salida: softmax vía CrossEntropyLoss
  dropout: 0.5                      # Dropout antes del único Linear de salida (sin head.hidden_dims)
  freeze_backbone: true             # Arranca congelado; unfreeze_at_epoch de abajo lo levanta
                                    # parcialmente desde la época 0.
  unfreeze_at_epoch: 0              # layer4 pasa a entrenable desde la primera época.
  unfreeze_layers: ["layer4"]       # Solo el último bloque convolucional (14.96M params);
                                    # stem + layer1-3 permanecen congelados toda la corrida.

training:
  epochs: 100                       # techo; early_stopping_patience decide el corte real
  save_best_checkpoint: true        # requerido por early_stopping_patience
  best_checkpoint_metric: roc_auc
  early_stopping_patience: 15       # detiene tras 15 épocas sin mejorar val_roc_auc
  grad_clip_norm: 1.0
  mixed_precision: true
  optimizer:
    name: adamw
    lr: 1.0e-4
    lr_head: 1.0e-3         # LR de la cabeza (siempre entrenable)
    lr_backbone: 1.0e-4     # LR de layer4 una vez descongelado (desde la época 0 aquí)
    weight_decay: 1.0e-4
  scheduler:
    name: cosine
    t_max: 100
  augmentation:
    horizontal_flip: false
    vertical_flip: false
    rotate_limit: 0
    brightness_contrast: false
    elastic: false
    normalize_preset: radimagenet_rgb
  loss:
    name: ce
    auto_class_weights: true

evaluation:
  threshold: 0.5
  save_predictions: true
