# exp67_linear_head_radimagenet_unfreeze_l4_aug — ablación de AUMENTOS:
# misma arquitectura y configuración de exp63 (cabeza lineal, layer4
# descongelado desde época 0), image_size se deja en 224 sin cambios (para
# no mezclar esta variable con la resolución de exp66), activando un set
# conservador de aumentos clínicamente defendibles:
#
#   horizontal_flip: true   — verificado empíricamente que el manifest NO
#     normaliza lateralidad: sobre una muestra de 50 imágenes cmmd (único
#     dataset con copia local para verificar), laterality=L tiene el tejido
#     mamario del lado izquierdo de la imagen en 21/25 casos y laterality=R
#     del lado derecho en 23/25 — es decir, el flip horizontal es
#     anatómicamente válido (no genera una configuración imposible), a
#     diferencia de si las imágenes ya vinieran todas normalizadas a un
#     mismo lado.
#   rotate_limit: 10        — conservador frente al default de base.yaml (15);
#     simula variación de posicionamiento del técnico sin distorsionar la
#     morfología de la lesión más allá de una rotación rígida pequeña.
#   brightness_contrast: true — simula variación entre equipos/scanners
#     (rango por defecto ±0.1, sin cambios en los límites).
#
# Deliberadamente NO se activa vertical_flip (rompe el eje pared torácica -
# pezón, anatómicamente imposible) ni elastic (deforma márgenes/espiculaciones,
# que son justamente la feature diagnóstica que el modelo debe aprender).
#
# Motivación: exp50-65 corren con augmentation completamente apagada (todas
# las flags en false/0) sobre solo 7 463 imágenes de train, y el mejor epoch
# cae consistentemente entre 2 y 15 de un techo de 100 — patrón de
# sobreajuste temprano que regularización vía aumentos de datos ataca
# directamente (a diferencia de exp66, que ataca la falta de información en
# la imagen de entrada, no el sobreajuste).
#
# num_workers: 0 -> 4 (cambio de infraestructura, no científico; ver exp66
# para el mismo razonamiento).
#
# Resto de hiperparámetros IDÉNTICOS a exp63 (ver ese archivo para el detalle
# completo de la ablación exp62-65).
#
# Estructura del manifest (manifests/mamo-bench-split-no-ddsm-rsna.csv):
#   train: 7 463 imgs  val: 934 imgs  test: 934 imgs  (9 331 total, 5 datasets)
#   (splits ya definidos en el CSV — val/test_fraction ignorados)
#
# Comando:
#   fedmammobench-centralized --config configs/exp67/centralized.yaml

name: exp67_linear_head_radimagenet_unfreeze_l4_aug
mode: centralized
seed: 42
output_dir: runs/exp67_linear_head_radimagenet_unfreeze_l4_aug
device: auto

data:
  name: mammo_bench
  manifest_path: manifests/mamo-bench-split-no-ddsm-rsna.csv   # 9 331 imgs, 5 datasets (sin DDSM)
  image_root: data/
  image_size: 224                   # sin cambios respecto a exp63 — solo augmentation varía aquí
  grayscale: false
  num_classes: 2
  batch_size: 32
  num_workers: 4                    # 0 -> 4 (infra, no científico)
  val_fraction: 0.1        # IGNORADO: el manifest ya trae split explícito
  test_fraction: 0.1       # IGNORADO: idem
  image_format: jpg
  normal_policy: benign
  balance_classes: true    # datasets desbalanceados (kau-bcmd, cmmd)

model:
  name: resnet50
  weight_source: radimagenet          # RadImageNet directamente (no exp15/exp27 pretrain)
  checkpoint_path: weights/RadImageNet-resnet50.pth
  in_channels: 3
  num_classes: 2                    # 2 neuronas de salida: softmax vía CrossEntropyLoss
  dropout: 0.5                      # Dropout antes del único Linear de salida (sin head.hidden_dims)
  freeze_backbone: true             # Arranca congelado; unfreeze_at_epoch de abajo lo levanta
                                    # parcialmente desde la época 0.
  unfreeze_at_epoch: 0              # layer4 pasa a entrenable desde la primera época.
  unfreeze_layers: ["layer4"]       # Solo el último bloque convolucional (14.96M params);
                                    # stem + layer1-3 permanecen congelados toda la corrida.

training:
  epochs: 100                       # techo; early_stopping_patience decide el corte real
  save_best_checkpoint: true        # requerido por early_stopping_patience
  best_checkpoint_metric: roc_auc
  early_stopping_patience: 15       # detiene tras 15 épocas sin mejorar val_roc_auc
  grad_clip_norm: 1.0
  mixed_precision: true
  optimizer:
    name: adamw
    lr: 1.0e-4
    lr_head: 1.0e-3         # LR de la cabeza (siempre entrenable)
    lr_backbone: 1.0e-4     # LR de layer4 una vez descongelado (desde la época 0 aquí)
    weight_decay: 1.0e-4
  scheduler:
    name: cosine
    t_max: 100
  augmentation:
    horizontal_flip: true             # verificado anatómicamente válido (ver comentario arriba)
    vertical_flip: false              # NO activar: anatómicamente imposible
    rotate_limit: 10                  # conservador frente al default (15)
    brightness_contrast: true
    elastic: false                    # NO activar: distorsiona la feature diagnóstica
    normalize_preset: radimagenet_rgb
  loss:
    name: ce
    auto_class_weights: true

evaluation:
  threshold: 0.5
  save_predictions: true
