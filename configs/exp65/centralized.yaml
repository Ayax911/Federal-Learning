# exp65_linear_head_radimagenet_unfreeze_l2l3l4 — cabeza lineal simple
# (AdaptiveAvgPool2d(1) -> Flatten() -> Dropout(0.5) -> Linear) + layer2,
# layer3 y layer4 de ResNet50 descongelados desde la época 0
#
# Cuarto y último experimento de la ablación exp62-65 (ver comentario de
# exp62 para la tabla completa). Variante de exp62 que descongela
# layer2+layer3+layer4 (1 219 584 + 7 098 368 + 14 964 736 = 23 282 688
# params) desde la primera época:
#
#   trainable = 4 098 (cabeza) + 23 282 688 (layer2+layer3+layer4) = 23 286 786 / 23 512 130
#   = 99.04% (frente al 93.85% de exp64)
#
# OJO: esto deja congelados únicamente el stem (conv1+bn1, 9 536 params) y
# layer1 (215 808 params) — juntos <1% del modelo. En la práctica esta
# variante es casi fine-tuning completo del backbone, no un descongelamiento
# "parcial" en el sentido habitual; se incluye igual porque es el extremo
# pedido de la ablación (comparar contra exp62/63/64).
#
# Usa el fix v0.8.0 de unfreeze progresivo centralizado (Trainer.fit ahora
# aplica apply_freeze_policy por época — antes solo funcionaba en federado,
# ver CHANGELOG [0.8.0] y memoria centralized_progressive_unfreeze_fix).
#
# Resto de hiperparámetros IDÉNTICOS a exp62/63/64: mismo manifest, mismo
# optimizer (lr_head/lr_backbone SIN reducir pese a ser la variante con más
# capacidad entrenable — se mantiene igual entre las 4 variantes para aislar
# la variable de interés, que es solo unfreeze_layers), sin augmentation,
# dropout=0.5, early stopping patience 15.
#
# Estructura del manifest (manifests/mamo-bench-split-no-ddsm-rsna.csv):
#   train: 7 463 imgs  val: 934 imgs  test: 934 imgs  (9 331 total, 5 datasets)
#   (splits ya definidos en el CSV — val/test_fraction ignorados)
#
# Comando:
#   fedmammobench-centralized --config configs/exp65/centralized.yaml

name: exp65_linear_head_radimagenet_unfreeze_l2l3l4
mode: centralized
seed: 42
output_dir: runs/exp65_linear_head_radimagenet_unfreeze_l2l3l4
device: auto

data:
  name: mammo_bench
  manifest_path: manifests/mamo-bench-split-no-ddsm-rsna.csv   # 9 331 imgs, 5 datasets (sin DDSM)
  image_root: data/
  image_size: 224
  grayscale: false
  num_classes: 2
  batch_size: 32
  num_workers: 0
  val_fraction: 0.1        # IGNORADO: el manifest ya trae split explícito
  test_fraction: 0.1       # IGNORADO: idem
  image_format: jpg
  normal_policy: benign
  balance_classes: true    # datasets desbalanceados (kau-bcmd, cmmd)

model:
  name: resnet50
  weight_source: radimagenet          # RadImageNet directamente (no exp15/exp27 pretrain)
  checkpoint_path: weights/RadImageNet-resnet50.pth
  in_channels: 3
  num_classes: 2                    # 2 neuronas de salida: softmax vía CrossEntropyLoss
  dropout: 0.5                      # Dropout antes del único Linear de salida (sin head.hidden_dims)
  freeze_backbone: true             # Arranca congelado; unfreeze_at_epoch de abajo lo levanta
                                    # parcialmente desde la época 0.
  unfreeze_at_epoch: 0              # layer2+layer3+layer4 pasan a entrenables desde la primera época.
  unfreeze_layers: ["layer2", "layer3", "layer4"]   # stem + layer1 permanecen congelados toda la corrida.

training:
  epochs: 100                       # techo; early_stopping_patience decide el corte real
  save_best_checkpoint: true        # requerido por early_stopping_patience
  best_checkpoint_metric: roc_auc
  early_stopping_patience: 15       # detiene tras 15 épocas sin mejorar val_roc_auc
  grad_clip_norm: 1.0
  mixed_precision: true
  optimizer:
    name: adamw
    lr: 1.0e-4
    lr_head: 1.0e-3         # LR de la cabeza (siempre entrenable)
    lr_backbone: 1.0e-4     # LR de layer2+layer3+layer4 una vez descongelados (desde la época 0 aquí)
    weight_decay: 1.0e-4
  scheduler:
    name: cosine
    t_max: 100
  augmentation:
    horizontal_flip: false
    vertical_flip: false
    rotate_limit: 0
    brightness_contrast: false
    elastic: false
    normalize_preset: radimagenet_rgb
  loss:
    name: ce
    auto_class_weights: true

evaluation:
  threshold: 0.5
  save_predictions: true
