# exp69_linear_head_radimagenet_unfreeze_l4_res512_aug — COMBO de exp66 + exp67:
# misma arquitectura y configuración de exp63 (cabeza lineal, layer4
# descongelado desde época 0), combinando las dos variables que exp66 y
# exp67 probaron por separado:
#
#   image_size: 512    (de exp66)          — recupera señal fina perdida a 224px
#   augmentation ON    (de exp67)          — regulariza contra el sobreajuste
#
# Resultado de exp66/exp67 evaluados con AUC macro intra-dataset (la métrica
# honesta — ver runs/exp63.../plots/test_metrics_by_dataset.csv y análogos):
#   exp63 (baseline, 224px, sin aug)  macro_auc=0.6732
#   exp66 (512px, sin aug)            macro_auc=0.7019  — dmid sube 0.690->0.847
#     (el dataset de mayor resolución nativa), pero sobreajusta más fuerte
#     (train_loss->0.03, val_loss diverge a 1.38, best_epoch=4 de ~20 corridas)
#   exp67 (224px, con aug)            macro_auc=0.6904  — mejora más distribuida
#     (cmmd, cdd-cesm, kau-bcmd suben) y sobreajusta menos (train_loss
#     termina en 0.36, corre 27 épocas, best_epoch=11), pero inbreast BAJA
#     (0.610->0.574) y dmid solo sube parcialmente (0.690->0.744, menos que
#     exp66 porque la aug no repone señal de resolución que ya se perdió).
#
# Motivación de este experimento: las dos intervenciones parecen atacar
# problemas distintos y complementarios (resolución = señal perdida;
# augmentation = sobreajuste), así que la hipótesis es que combinarlas suma
# los beneficios de cada una sin heredar sus debilidades individuales —
# en particular, que la aug debería frenar el sobreajuste más agresivo que
# exp66 mostró al subir la resolución.
#
# num_workers: 4 (igual que exp66/exp67 — a partir de 512px la decodificación
# JPEG en el proceso principal es cuello de botella).
#
# Resto de hiperparámetros IDÉNTICOS a exp63 (cabeza lineal Dropout(0.5)+Linear,
# layer4 descongelado desde época 0, early stopping patience 15).
#
# Estructura del manifest (manifests/mamo-bench-split-no-ddsm-rsna.csv):
#   train: 7 463 imgs  val: 934 imgs  test: 934 imgs  (9 331 total, 5 datasets)
#   (splits ya definidos en el CSV — val/test_fraction ignorados)
#
# Comando:
#   fedmammobench-centralized --config configs/exp69/centralized.yaml

name: exp69_linear_head_radimagenet_unfreeze_l4_res512_aug
mode: centralized
seed: 42
output_dir: runs/exp69_linear_head_radimagenet_unfreeze_l4_res512_aug
device: auto

data:
  name: mammo_bench
  manifest_path: manifests/mamo-bench-split-no-ddsm-rsna.csv   # 9 331 imgs, 5 datasets (sin DDSM)
  image_root: data/
  image_size: 512                   # de exp66
  grayscale: false
  num_classes: 2
  batch_size: 32
  num_workers: 4                    # 512px: decodificación JPEG es cuello de botella con 0 workers
  val_fraction: 0.1        # IGNORADO: el manifest ya trae split explícito
  test_fraction: 0.1       # IGNORADO: idem
  image_format: jpg
  normal_policy: benign
  balance_classes: true    # datasets desbalanceados (kau-bcmd, cmmd)

model:
  name: resnet50
  weight_source: radimagenet          # RadImageNet directamente (no exp15/exp27 pretrain)
  checkpoint_path: weights/RadImageNet-resnet50.pth
  in_channels: 3
  num_classes: 2                    # 2 neuronas de salida: softmax vía CrossEntropyLoss
  dropout: 0.5                      # Dropout antes del único Linear de salida (sin head.hidden_dims)
  freeze_backbone: true             # Arranca congelado; unfreeze_at_epoch de abajo lo levanta
                                    # parcialmente desde la época 0.
  unfreeze_at_epoch: 0              # layer4 pasa a entrenable desde la primera época.
  unfreeze_layers: ["layer4"]       # Solo el último bloque convolucional (14.96M params);
                                    # stem + layer1-3 permanecen congelados toda la corrida.

training:
  epochs: 100                       # techo; early_stopping_patience decide el corte real
  save_best_checkpoint: true        # requerido por early_stopping_patience
  best_checkpoint_metric: roc_auc
  early_stopping_patience: 15       # detiene tras 15 épocas sin mejorar val_roc_auc
  grad_clip_norm: 1.0
  mixed_precision: true
  optimizer:
    name: adamw
    lr: 1.0e-4
    lr_head: 1.0e-3         # LR de la cabeza (siempre entrenable)
    lr_backbone: 1.0e-4     # LR de layer4 una vez descongelado (desde la época 0 aquí)
    weight_decay: 1.0e-4
  scheduler:
    name: cosine
    t_max: 100
  augmentation:
    horizontal_flip: true             # de exp67 — verificado anatómicamente válido
    vertical_flip: false              # NO activar: anatómicamente imposible
    rotate_limit: 10                  # de exp67 — conservador frente al default (15)
    brightness_contrast: true         # de exp67
    elastic: false                    # NO activar: distorsiona la feature diagnóstica
    normalize_preset: radimagenet_rgb
  loss:
    name: ce
    auto_class_weights: true

evaluation:
  threshold: 0.5
  save_predictions: true
