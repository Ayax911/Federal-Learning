# exp56_mlp5_d02_radimagenet_best15 — follow-up de exp54: mismos hiperparámetros
# (5 capas ocultas [512,256,128,64,32], dropout 0.2, RadImageNet CONGELADO), pero
# con epochs: 15 (en vez de 100) y save_best_checkpoint activado.
#
# Motivo: en exp50-55, las 6 configuraciones alcanzan su mejor val_roc_auc entre
# la época 3 y 15 (~0.86-0.865) y luego se DEGRADAN de forma ruidosa hasta la
# época 100 por sobreajuste (train_loss -> ~0.03-0.04, val_loss sube de ~0.5 a
# ~1.5-1.7 en el brazo con dropout 0.2). El AUC de test reportado (0.8517 para
# exp54) corresponde al checkpoint de la última época, ya degradado, no al mejor
# alcanzado (~0.864, época 5) — el pipeline no tenía forma de recuperar el mejor
# checkpoint. Ver memoria `training_pipeline_no_early_stopping` /
# `mlp_head_linear_probing_exp50_55`.
#
# Este experimento usa la nueva funcionalidad de Trainer/run_centralized.py
# (training.save_best_checkpoint) para guardar `weights/best.pt` cada vez que
# val_roc_auc mejora, y evaluar test sobre ESE checkpoint en vez del de la
# última época. epochs: 15 acorta la corrida al rango donde ya se observó el
# pico en exp54 (con margen), evitando además gastar cómputo en 85 épocas de
# puro sobreajuste. scheduler.t_max se ajusta a 15 para que el coseno complete
# su ciclo sobre la duración real del entrenamiento (igual que en exp50-55,
# donde t_max == epochs).
#
# Comando:
#   fedmammobench-centralized --config configs/exp56/centralized.yaml
# (o vía /docker-run exp56)

name: exp56_mlp5_d02_radimagenet_best15
mode: centralized
seed: 42
output_dir: runs/exp56_mlp5_d02_radimagenet_best15
device: auto

data:
  name: mammo_bench
  manifest_path: manifests/mamo-bench-split-no-ddsm-rsna.csv   # 9 331 imgs, 5 datasets (sin DDSM)
  image_root: data/
  image_size: 224
  grayscale: false
  num_classes: 2
  batch_size: 32
  num_workers: 0
  val_fraction: 0.1        # IGNORADO: el manifest ya trae split explícito
  test_fraction: 0.1       # IGNORADO: idem
  image_format: jpg
  normal_policy: benign
  balance_classes: true    # datasets desbalanceados (kau-bcmd, cmmd)

model:
  name: resnet50
  weight_source: radimagenet          # RadImageNet directamente (no exp15/exp27 pretrain)
  checkpoint_path: weights/RadImageNet-resnet50.pth
  in_channels: 3
  num_classes: 2                    # 2 neuronas de salida: softmax vía CrossEntropyLoss
  dropout: 0.2                      # igual que exp54 (brazo con dropout del factorial)
  head:
    hidden_dims: [512, 256, 128, 64, 32]
    activation: leaky_relu
    batch_norm: false
  freeze_backbone: true             # LINEAR PROBING: congela los 318 tensores de RadImageNet.
                                    # Solo backbone.fc queda entrenable (1.22M / 24.7M = 4.95%).
                                    # Las 53 BatchNorm del backbone quedan fijadas en eval por
                                    # _freeze_bn_running_stats (trainer.py), así que sus
                                    # running_mean/var tampoco derivan.

training:
  epochs: 15                        # acortado de 100: el pico de val_roc_auc en exp50-55
                                    # siempre se alcanzó entre las épocas 3 y 15
  save_best_checkpoint: true        # NUEVO: guarda weights/best.pt cada vez que val_roc_auc
                                    # mejora; run_centralized.py evalúa test sobre ese
                                    # checkpoint en vez del de la última época
  best_checkpoint_metric: roc_auc
  grad_clip_norm: 1.0
  mixed_precision: true
  optimizer:
    name: adamw
    lr: 1.0e-4
    lr_head: 1.0e-3         # el ÚNICO LR activo: con el backbone congelado el optimizador
                            # tiene un solo grupo de parámetros (la cabeza)
    lr_backbone: 1.0e-4     # INACTIVO con freeze_backbone: true (no hay grupo de backbone).
                            # Se conserva por si una ablación futura lo descongela.
    weight_decay: 1.0e-4
  scheduler:
    name: cosine
    t_max: 15               # == epochs, igual que en exp50-55 (t_max == epochs)
  augmentation:
    horizontal_flip: false
    vertical_flip: false
    rotate_limit: 0
    brightness_contrast: false
    elastic: false
    normalize_preset: radimagenet_rgb
  loss:
    name: ce
    auto_class_weights: true

evaluation:
  threshold: 0.5
  save_predictions: true
