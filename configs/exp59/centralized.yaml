# exp59_mlp4_nodrop_radimagenet_unfreeze_l4 — FINE-TUNING PARCIAL: 4 capas ocultas,
# SIN dropout, layer4 de ResNet50 descongelado desde la época 0 + early stopping
# (paciencia 15 épocas)
#
# Variante de exp52 (linear probing puro) que añade dos cambios:
#
#  1. model.unfreeze_at_epoch: 0 + model.unfreeze_layers: ["layer4"] — el último
#     bloque convolucional de ResNet50 (14 964 736 parámetros) queda entrenable
#     desde la primera época, en vez de permanecer congelado las 100 épocas como en
#     exp52. El resto del backbone (stem + layer1-3) sigue congelado. Con esto
#     16 186 434 de 24 729 730 parámetros son entrenables (65.45%), frente al 4.94%
#     de exp52. Esto requirió corregir un bug real: Trainer.fit nunca llamaba a
#     apply_freeze_policy por época (solo el cliente federado lo hacía por ronda),
#     así que unfreeze_at_epoch no tenía ningún efecto en modo centralizado antes de
#     este fix — ver CHANGELOG [0.8.0] y memoria training_pipeline_no_early_stopping.
#
#  2. training.early_stopping_patience: 15 (requiere save_best_checkpoint: true) —
#     detiene el entrenamiento tras 15 épocas consecutivas sin mejorar val_roc_auc,
#     en vez de correr las 100 épocas completas y sobreajustar (en exp50-55 todas
#     pican entre la época 3 y 15 y luego se degradan). epochs se deja en 100 como
#     techo — el early stopping decide el punto real de corte. scheduler.t_max se
#     deja igual a epochs (100), como en todos los configs previos (t_max == epochs).
#
# Resto de hiperparámetros IDÉNTICOS a exp52: mismo manifest, mismo optimizer
# (lr_head/lr_backbone), misma augmentación (ninguna), dropout=0.0, misma cabeza
# [512, 256, 128, 64].
#
# Estructura del manifest (manifests/mamo-bench-split-no-ddsm-rsna.csv):
#   train: 7 463 imgs  val: 934 imgs  test: 934 imgs  (9 331 total, 5 datasets)
#   (splits ya definidos en el CSV — val/test_fraction ignorados)
#
# Comando:
#   fedmammobench-centralized --config configs/exp59/centralized.yaml

name: exp59_mlp4_nodrop_radimagenet_unfreeze_l4
mode: centralized
seed: 42
output_dir: runs/exp59_mlp4_nodrop_radimagenet_unfreeze_l4
device: auto

data:
  name: mammo_bench
  manifest_path: manifests/mamo-bench-split-no-ddsm-rsna.csv   # 9 331 imgs, 5 datasets (sin DDSM)
  image_root: data/
  image_size: 224
  grayscale: false
  num_classes: 2
  batch_size: 32
  num_workers: 0
  val_fraction: 0.1        # IGNORADO: el manifest ya trae split explícito
  test_fraction: 0.1       # IGNORADO: idem
  image_format: jpg
  normal_policy: benign
  balance_classes: true    # datasets desbalanceados (kau-bcmd, cmmd)

model:
  name: resnet50
  weight_source: radimagenet          # RadImageNet directamente (no exp15/exp27 pretrain)
  checkpoint_path: weights/RadImageNet-resnet50.pth
  in_channels: 3
  num_classes: 2                    # 2 neuronas de salida: softmax vía CrossEntropyLoss
  dropout: 0.0                      # brazo SIN dropout del factorial (no hay gemelo con
                                    # dropout en este trío de 3 — exp55 quedó fuera)
  head:
    hidden_dims: [512, 256, 128, 64]
    activation: leaky_relu
    batch_norm: false
  freeze_backbone: true             # Arranca congelado (igual que exp52); unfreeze_at_epoch
                                    # de abajo lo levanta parcialmente desde la época 0.
  unfreeze_at_epoch: 0              # layer4 pasa a entrenable desde la primera época.
  unfreeze_layers: ["layer4"]       # Solo el último bloque convolucional (14.96M params);
                                    # stem + layer1-3 permanecen congelados toda la corrida.

training:
  epochs: 100                       # techo; early_stopping_patience decide el corte real
  save_best_checkpoint: true        # requerido por early_stopping_patience
  best_checkpoint_metric: roc_auc
  early_stopping_patience: 15       # detiene tras 15 épocas sin mejorar val_roc_auc
  grad_clip_norm: 1.0
  mixed_precision: true
  optimizer:
    name: adamw
    lr: 1.0e-4
    lr_head: 1.0e-3         # LR de la cabeza (siempre entrenable)
    lr_backbone: 1.0e-4     # LR de layer4 una vez descongelado (desde la época 0 aquí)
    weight_decay: 1.0e-4
  scheduler:
    name: cosine
    t_max: 100
  augmentation:
    horizontal_flip: false
    vertical_flip: false
    rotate_limit: 0
    brightness_contrast: false
    elastic: false
    normalize_preset: radimagenet_rgb
  loss:
    name: ce
    auto_class_weights: true

evaluation:
  threshold: 0.5
  save_predictions: true
