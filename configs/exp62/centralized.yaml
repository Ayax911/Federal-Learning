# exp62_linear_head_radimagenet_frozen — LINEAR PROBING con cabeza lineal
# simple (no MLP): AdaptiveAvgPool2d(1) -> Flatten() -> Dropout(0.5) -> Linear
#
# Primer experimento de una ablación de 4 (exp62-65) que mide el efecto de
# descongelar progresivamente más bloques finales de ResNet50, mantiendo fija
# la arquitectura de cabeza (cabeza lineal única, no la MLP de exp50-61):
#
#              unfreeze_layers                trainable / total    %
#   exp62      (ninguno, solo cabeza)          4 098 / 23 512 130   0.02%
#   exp63      ["layer4"]                      14 968 834 / ...    63.66%
#   exp64      ["layer3", "layer4"]            22 067 202 / ...    93.85%
#   exp65      ["layer2", "layer3", "layer4"]  23 286 786 / ...    99.04%
#
# exp62 es la variante base: freeze_backbone: true SIN unfreeze_at_epoch —
# el backbone RadImageNet queda 100% congelado toda la corrida, solo entrena
# la cabeza (4 098 params: Dropout(0.5) + Linear(2048, 2)). Sirve de control
# para medir cuánto aportan los bloques descongelados en exp63-65.
#
# Diferencia con exp50 (que también es "solo cabeza congelada"): exp50 usa una
# cabeza MLP de 6 capas ocultas + dropout 0.0; aquí la cabeza es un único
# Linear (sin head.hidden_dims) con dropout 0.5 — arquitectura mucho más
# simple y con más regularización, ya que exp63-65 descongelan mucha más
# capacidad del backbone y el riesgo de overfitting sube (dataset de 9 331
# imágenes).
#
# training.early_stopping_patience: 15 (requiere save_best_checkpoint: true) —
# mismo patrón que exp57-61: detiene tras 15 épocas sin mejorar val_roc_auc en
# vez de correr las 100 épocas completas. epochs se deja en 100 como techo;
# scheduler.t_max se deja igual a epochs (100), como en todos los configs
# previos (t_max == epochs).
#
# SIN aumento de imágenes (augmentation en false/0), igual que exp50-61, para
# mantener comparabilidad directa con esa serie.
#
# Estructura del manifest (manifests/mamo-bench-split-no-ddsm-rsna.csv):
#   train: 7 463 imgs  val: 934 imgs  test: 934 imgs  (9 331 total, 5 datasets)
#   (splits ya definidos en el CSV — val/test_fraction ignorados)
#
# Comando:
#   fedmammobench-centralized --config configs/exp62/centralized.yaml

name: exp62_linear_head_radimagenet_frozen
mode: centralized
seed: 42
output_dir: runs/exp62_linear_head_radimagenet_frozen
device: auto

data:
  name: mammo_bench
  manifest_path: manifests/mamo-bench-split-no-ddsm-rsna.csv   # 9 331 imgs, 5 datasets (sin DDSM)
  image_root: data/
  image_size: 224
  grayscale: false
  num_classes: 2
  batch_size: 32
  num_workers: 0
  val_fraction: 0.1        # IGNORADO: el manifest ya trae split explícito
  test_fraction: 0.1       # IGNORADO: idem
  image_format: jpg
  normal_policy: benign
  balance_classes: true    # datasets desbalanceados (kau-bcmd, cmmd)

model:
  name: resnet50
  weight_source: radimagenet          # RadImageNet directamente (no exp15/exp27 pretrain)
  checkpoint_path: weights/RadImageNet-resnet50.pth
  in_channels: 3
  num_classes: 2                    # 2 neuronas de salida: softmax vía CrossEntropyLoss
  dropout: 0.5                      # Dropout antes del único Linear de salida (sin head.hidden_dims)
  freeze_backbone: true             # Backbone 100% congelado toda la corrida (solo la cabeza entrena)
  # Sin unfreeze_at_epoch/unfreeze_layers: si se pusiera unfreeze_at_epoch
  # con unfreeze_layers vacío, apply_freeze_policy descongelaría TODO el
  # backbone (rama "full unfreeze") — lo opuesto de lo que se quiere aquí.

training:
  epochs: 100                       # techo; early_stopping_patience decide el corte real
  save_best_checkpoint: true        # requerido por early_stopping_patience
  best_checkpoint_metric: roc_auc
  early_stopping_patience: 15       # detiene tras 15 épocas sin mejorar val_roc_auc
  grad_clip_norm: 1.0
  mixed_precision: true
  optimizer:
    name: adamw
    lr: 1.0e-4
    lr_head: 1.0e-3         # LR de la cabeza (siempre entrenable)
    lr_backbone: 1.0e-4     # LR del backbone si llegara a descongelarse (no aplica aquí)
    weight_decay: 1.0e-4
  scheduler:
    name: cosine
    t_max: 100
  augmentation:
    horizontal_flip: false
    vertical_flip: false
    rotate_limit: 0
    brightness_contrast: false
    elastic: false
    normalize_preset: radimagenet_rgb
  loss:
    name: ce
    auto_class_weights: true

evaluation:
  threshold: 0.5
  save_predictions: true
